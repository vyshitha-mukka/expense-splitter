<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Expense Splitter v2</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:0 auto;padding:20px;background:#f5f7fa}
    nav a{margin-right:16px;text-decoration:none;color:#1a56db;font-weight:bold}
    .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 4px #0002;margin-top:16px}
    input,button{padding:8px;margin:6px 0;width:100%;box-sizing:border-box}
    button{background:#1a56db;color:#fff;border:0;border-radius:4px;cursor:pointer}
    table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
    .flash{background:#e6f4ea;padding:8px;border-radius:4px;margin-top:10px}
  </style>
</head>
<body>
  <h1>💸 Expense Splitter</h1>
  <nav><a href="/">Add Expense</a><a href="/expenses">Expenses</a><a href="/settle">Settle Up</a></nav>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
