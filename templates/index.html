{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Add a new expense</h2>
  <form method="post" action="/add">
    <input name="description" placeholder="What was it for? (e.g. Dinner)" required>
    <input name="amount" type="number" step="0.01" placeholder="Amount (₹)" required>
    <input name="payer" placeholder="Who paid? (e.g. Asha)" required>
    <input name="people" placeholder="Split among (comma separated, include payer): Asha, Ravi, Meena" required>
    <button type="submit">Add Expense</button>
  </form>
</div>
{% endblock %}
